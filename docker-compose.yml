services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jolly_tailor
      POSTGRES_USER: jolly_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - jolly_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jolly_app -d jolly_tailor"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/jolly_tailor
      DB_USERNAME: jolly_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?Set BOOTSTRAP_ADMIN_USERNAME in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_TAILOR_USERNAME: ${BOOTSTRAP_TAILOR_USERNAME:?Set BOOTSTRAP_TAILOR_USERNAME in .env}
      BOOTSTRAP_TAILOR_PASSWORD: ${BOOTSTRAP_TAILOR_PASSWORD:?Set BOOTSTRAP_TAILOR_PASSWORD in .env}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT:-}
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID:-}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY:-}
      SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL:-}
      SUPABASE_PUBLIC_BUCKET: ${SUPABASE_PUBLIC_BUCKET:-tailor-catalog}
    ports:
      - "8080:8080"
volumes:
  jolly_postgres_data:
