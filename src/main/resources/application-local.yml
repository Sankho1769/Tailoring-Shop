server:
  port: ${PORT:8080}
  address: 0.0.0.0
spring:
  datasource:
    url: jdbc:h2:file:./data/jolly_tailor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS CLOB
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
app:
  bootstrap:
    admin-username: admin
    admin-password: AdminPassword123!
    tailor-username: tailor1
    tailor-password: TailorPassword123!
