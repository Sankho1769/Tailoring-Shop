server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
spring:
  application:
    name: jolly-ladies-tailor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    hikari:
      maximum-pool-size: 8
      connection-timeout: 30000
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  jackson:
    default-property-inclusion: non_null
app:
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    tailor-username: ${BOOTSTRAP_TAILOR_USERNAME:}
    tailor-password: ${BOOTSTRAP_TAILOR_PASSWORD:}
  storage:
    endpoint: ${SUPABASE_S3_ENDPOINT:}
    access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID:}
    secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY:}
    project-url: ${SUPABASE_PROJECT_URL:}
    bucket: ${SUPABASE_PUBLIC_BUCKET:tailor-catalog}
